version: 0.26.0
date: 2026-10-17
locales:
  en:
    summary: "Harness Node 0.26.0 advances only in lockstep with the four release units. It introduces no capability, API, Schema, protocol, or mechanism."
    changes:
      changed:
        - "Update only the package version and its managed version projections. Existing mechanisms, including contained reads, remain unchanged; published 0.25.0 functionality is not reimplemented."
    upgradeNotes: "Pin the three Foundation npm packages and the independent Plugin to exactly 0.26.0. Contracts specification 1.20.0 remains independent of the package version. Consumers should use the actual officially published public interfaces and sources. This note does not replace post-publish verification or claim that publication or consumer acceptance is complete."
  zh-CN:
    summary: "Harness Node 0.26.0 仅随四发布单元锁步更新，未引入新能力、API、Schema、协议或机制。"
    changes:
      changed:
        - "仅更新包版本及受管版本派生，保持既有受收容读取等机制不变，不重做 0.25.0 已发布功能。"
    upgradeNotes: "三个 Foundation npm 包及独立 Plugin 须精确同版为 0.26.0。Contracts 规格保持 1.20.0，与包版本独立管理。消费方应使用实际正式发布的公共接口与来源；本说明不替代发布后验证，也不宣称发布或消费者验收已经完成。"
