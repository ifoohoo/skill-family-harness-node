version: 0.31.0
date: 2026-11-01
locales:
  en:
    summary: This release enforces version lockstep at 0.31.0 with no changes to path handling,
      file reading, digest computation, or closure generation. The Kit reuses readFileStrict
      and computeResourceClosure directly. Platform qualification scope remains unchanged.
    changes:
      changed:
        - No modifications to existing path, read, digest, or closure behavior. Kit uses
          readFileStrict and computeResourceClosure without alteration.
    upgradeNotes: All four units must upgrade to exactly 0.31.0. No expansion of platform
      qualification is implied. The existing platform scope is preserved.
  zh-CN:
    summary: 本次发布仅执行0.31.0版本锁步，路径处理、文件读取、摘要计算及闭包生成机制均无变更。Kit直接复用readFileStrict与computeResourceClosure。平台资格范围不变。
    changes:
      changed:
        - 路径、读取、摘要、闭包机制未改动。Kit直接使用readFileStrict与computeResourceClosure。
    upgradeNotes: 四单元必须精确升级至0.31.0。本轮不扩大平台资格范围，既存平台范围保持不变。
